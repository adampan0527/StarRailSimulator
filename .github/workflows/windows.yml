name: Windows baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the locked npm version
        run: npm.cmd install --global --no-audit --no-fund npm@11.14.1
      - name: Verify the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install npm dependencies
        run: npm.cmd ci --no-audit --no-fund
      - name: Check frontend and contract
        run: npm.cmd run check
      - name: Check and build the Windows app
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run desktop:build
      - name: Check roadmap report
        run: npm.cmd run roadmap:check
