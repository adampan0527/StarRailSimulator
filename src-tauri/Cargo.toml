[package]
name = "star-rail-simulator"
version = "0.1.0"
edition = "2024"
publish = false

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
rusqlite = { version = "=0.39.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
star-rail-battle-core = { path = "../crates/battle-core" }
star-rail-profiles = { path = "../crates/profiles" }
tauri = { version = "=2.12.5", features = [] }
thiserror = "=2.0.21"

[dev-dependencies]
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_UI_Controls_Dialogs"] }
